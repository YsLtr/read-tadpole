name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload the release assets for (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Google Drive backup uses the reader's own OAuth client; without this
      # secret the build keeps the placeholder client id and that feature stays off.
      - name: Build zips (Chrome, Edge, Firefox)
        run: pnpm zip:all
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}

      - name: Create or update Release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ZIPS=".output/read-tadpole-*-chrome.zip .output/read-tadpole-*-edge.zip .output/read-tadpole-*-firefox.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $ZIPS --clobber
          else
            # Release notes: the newest CHANGELOG entry, up to the next version.
            awk '/^## /{count++} count==1' CHANGELOG.md > release-notes.md
            gh release create "$TAG" $ZIPS --title "ReadTadpole $TAG" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
